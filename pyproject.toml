[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sesametalk-agent-evals"
version = "0.0.0"
description = "SesameTalk public practice eval harness (no production credentials)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[tool.setuptools.packages.find]
where = ["."]
include = ["sesametalk_agent_evals*"]
